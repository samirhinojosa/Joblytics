services:
  postgres:
    image: postgres:16.4
    container_name: joblytics_db
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost (safer)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
